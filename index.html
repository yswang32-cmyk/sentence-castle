function load(){try{var p=JSON.parse(localStorage.getItem("castle1"));if(p&&p.c)return p}catch(e){}return{xp:0,c:[0,0,0,0,0,0],weak:[]}}

function $(i){return document.getElementById(i)}

function vis(k){var v=vt(),t=v&&v.t;
if(k=="S"||k=="V")return true;if(!v)return false;
if(k=="O")return t&&lv>=2;if(k=="WH")return !t&&lv>=1;if(k=="TM")return lv>=1&&lv<=3;
if(k=="ADJ")return t&&lv==3&&!v.n;if(k=="ADV")return lv>=3&&v.ad.length>0;return lv==4}
function list(k){var v=vt();
if(k=="S")return SUB;if(k=="V")return pool();if(k=="O")return v.o;if(k=="WH")return v.wh;if(k=="TM")return TM;

function low(s){return s.replace(/^(The|My|He|She|We|They|You) /,function(m){return m.toLowerCase()})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function sentence(){if(!st.S||!st.V)return"";var v=vt(),p=[st.S,st.V];

function check(t){var m=[];t=t.trim();
if(!t)return["先寫一個句子"];
t.split(/(?<=[.!?])\s+/).forEach(function(s){
if(/^[a-z]/.test(s))m.push("句子開頭要大寫："+s);
if(!/[.!?]$/.test(s))m.push("句尾要加句點："+s)});
if(/\b(is|am|are)\s+(very\s+)?(love|like|eat|walk|run|jump|dance|swim|write|take)\b/i.test(t))m.push("一個句子只有一個主要動詞，不要 is 加動詞（例如 I love，不是 I am love）");
if(/\beaten\b/i.test(t))m.push("過去式要用 ate，eaten 是另一種形式");
if(/\b(runned|eated|taked|writed|swimmed|catched|teached|meaned)\b/i.test(t))m.push("這是不規則動詞：ran, ate, took, wrote, swam, caught, taught, meant");
if(/\b(walked|swam|ran|jumped)\s+the\b/i.test(t))m.push("動詞後面要先加 in / to / across / over，再放 the 地點");
if(/\b(hurried|ran|walked)\s+(take|go|eat|get)\b/i.test(t))m.push("兩個動詞不能直接連在一起，要加 to（hurried to take）或用 and");
if(/\b(in|on|at)\s+(yesterday|last\s+\w+|this\s+(morning|afternoon|evening|week)|today|tomorrow)\b/i.test(t))m.push('yesterday、last、this 開頭的時間前面不用 in／on／at');
if(/\bin\s+(morning|afternoon|evening)\b/i.test(t))m.push('早上、下午、晚上要說 in the morning／afternoon／evening');
if(/\bat\s+the\s+night\b/i.test(t))m.push('夜晚要說 at night，不加 the');
if(/\b(ate|wrote|took|taught|caught|fooled)\s+(quickly|slowly|carefully|happily|loudly|quietly|well|fast|sadly)\s+(a|an|the|my|his|her|our|your|rice|noodles|english|math|cake|breakfast)\b/i.test(t))m.push('副詞不放在動詞和受詞中間，要放到句尾（例如 ate rice quickly）');

var lvl=1+Math.floor(P.xp/50),T=["見習生","小兵","探險家","騎士","魔法師","故事王"];

function sem(){var v=vt(),w=[];if(!v||!st.S)return w;var S=st.S,N=st.V,O=st.O||'',tm=st.TM||'',A=['The dog','The cat','The baby'];

function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function cur(){return lv==5?($("ta")?$("ta").value:""):sentence()}
function award(s,m){
if(lv<5&&!ready()){m.textContent="還有必選的格子沒有填喔";m.className="msg bad";return}
var c=check(s);if(c.length){m.textContent=c.join("；");m.className="msg bad";return}
var n=s.split(/[.!?]/).filter(function(x){return x.trim()}).length,g=10;
if(lv==5){if(n<2){m.textContent="故事要有至少 2 句";m.className="msg bad";return}g=n>=3?25:15}
P.xp+=g;P.c[lv]++;save();m.textContent="🎉 +"+g+" XP！"+(P.c[lv]==3&&lv<5?"下一關解鎖了！":"");m.className="msg good";
if(lv<5){st={};var t=$("sent");render();$("msg").textContent="🎉 +"+g+" XP！"+(P.c[lv]==3?"下一關解鎖了！":"");$("msg").className="msg good"}else{var x=$("msg").textContent;render();$("msg").textContent=x;$("msg").className="msg good"}}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
async function review(s){try{if(typeof claude==="undefined")return null;var sm=await claude.use("sample");if(!sm)return null;
var q="你是國小英文老師，學生是剛學過去式的小三生。請檢查學生寫的英文句子，目前關卡目標："+GOAL[lv]+"。檢查項目：時間詞前面的介係詞（例如 yesterday 前不用 in）、副詞位置、文法、過去式與不規則動詞、a/an、介系詞、動詞後面是否少了受詞或地點、連接詞是否合適，以及句意是否合理（例如 ate a bus 不合理）。細小但不影響理解的瑕疵可視為通過，在 praise 提醒即可。只回傳 JSON，不要 markdown：{\"ok\":true或false,\"zh\":\"整句的中文意思\",\"fix\":\"修正後的英文，通過時可給更自然的說法\",\"issues\":[{\"wrong\":\"出錯的片段\",\"why\":\"用小三聽得懂的繁體中文說明原因\",\"tip\":\"一句記憶小口訣，可為空字串\"}],\"praise\":\"一句鼓勵\"}。學生句子："+s;
var r=await sm(q,{modelTier:"quick",cache:false});return JSON.parse(r.text.replace(/```json|```/g,"").trim())}catch(e){return null}}
function showFb(r,s){var h='<div class="fbx '+(r.ok?"g":"b")+'"><div>📖 意思：'+esc(r.zh)+"</div>";
if(r.ok){h+="<div>✅ "+esc(r.praise||"句子正確！")+"</div>";if(r.fix&&r.fix.trim()!==s.trim())h+="<div>💡 也可以這樣說：<b>"+esc(r.fix)+'</b> <button data-say="'+esc(r.fix)+'">🔊</button></div>'}
else{(r.issues||[]).forEach(function(i){h+="<div>❌ <b>"+esc(i.wrong)+"</b>："+esc(i.why)+(i.tip?"<br>💡 "+esc(i.tip):"")+"</div>"});h+="<div>✏️ 建議寫法：<b>"+esc(r.fix)+'</b> <button data-say="'+esc(r.fix)+'">🔊</button></div>'}
$("fb").innerHTML=h+"</div>"}
async function done(){var s=cur(),m=$("msg"),b=$("bd");
if(!s.trim()||(lv<5&&!ready())){m.textContent=s.trim()?"還有必選的格子沒有填喔":"先寫一個句子";m.className="msg bad";return}
var w=lv<5?sem():[];if(w.length){m.textContent=w.join("；");m.className="msg bad";return}
b.disabled=true;m.textContent="🔍 老師檢查中…";m.className="msg";$("fb").innerHTML="";
var r=await review(s);b.disabled=false;
if(!r){award(s,m);$("fb").innerHTML='<div class="fbx">目前無法使用老師檢查，只做了基本文法檢查。</div>';return}
if(r.ok&&!check(s).length){award(s,m);showFb(r,s)}else{showFb(r,s);m.textContent=r.ok?check(s).join("；"):"修改後再按一次完成，就能拿到經驗值！";m.className="msg bad"}}
function listen(){var R=window.SpeechRecognition||window.webkitSpeechRecognition,s=cur(),m=$("msg");
if(!s.trim()){m.textContent="先造一個句子";m.className="msg bad";return}
if(!R){m.textContent="這個瀏覽器不能辨識聲音，先按「聽」再跟著唸";m.className="msg";return}
var r=new R();r.lang="en-US";m.textContent="🎤 請唸出來…";m.className="msg";
r.onresult=function(e){var said=e.results[0][0].transcript.toLowerCase().replace(/[^a-z ]/g,"").split(/\s+/),
tw=s.toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).filter(Boolean),miss=tw.filter(function(w){return said.indexOf(w)<0});
if(!miss.length){P.xp+=5;m.textContent="👏 唸得很清楚！+5 XP";m.className="msg good"}
else{miss.forEach(function(w){if(P.weak.indexOf(w)<0)P.weak.push(w)});m.textContent="再試一次，這些字要加油："+miss.join(", ");m.className="msg bad"}
save();var t=m.textContent,c=m.className;render();if(lv<5)upd();$("msg").textContent=t;$("msg").className=c};
r.onerror=function(){m.textContent="沒聽到，再試一次";m.className="msg bad"};try{r.start()}catch(e){}}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.lv!=null){lv=+d.lv;st={};render();$("msg").textContent="";return}
if(d.say){speak(d.say);return}
if(d.add){var ta=$("ta");ta.value+=(ta.value&&!/\s$/.test(ta.value)?" ":"")+d.add;speak(d.add);return}
if(d.k){var k=d.k,v=d.v;if(k=="V"){st={S:st.S,V:v}}else{st[k]=st[k]==v?"":v;if(k=="O")st.ADJ="";if(k=="CJ")st.T=""}
speak(v);render();return}
if(b.id=="bs")speak(cur());if(b.id=="bl")listen();if(b.id=="bd")done()});
document.addEventListener("input",function(e){var k=e.target.dataset&&e.target.dataset.k;if(!k||e.target.className!="cu")return;
st[k]=e.target.value.trim();if(k=="V"&&!V[st.V]){st.V=""}upd()});
render();
</script></body></html>
